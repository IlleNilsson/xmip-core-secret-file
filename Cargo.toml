# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-secret-file"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-secret-file"
description = "A key-encryption key in a file readable by the Service Identity alone: 0600 in a 0700 directory, refused when either is wider. A xmip-core-secret technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). KekHolder, the wrapping and the errors live there;
# this crate only keeps the key.
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main" }
# The key's bytes are overwritten when they are dropped.
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# The effective user a key file must belong to, asked of the kernel through a
# safe call: a module crate forbids unsafe, and libc's geteuid is one.
rustix = { version = "1", features = ["process"] }

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
